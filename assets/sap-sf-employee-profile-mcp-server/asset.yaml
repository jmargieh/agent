apiVersion: asset.sap/v1
kind: Asset
type: mcp-server

metadata:
  name: sap-sf-employee-profile-mcp-server
  description: Exposes SAP SuccessFactors Employee Profile information (public profile, education, languages) as read-only MCP tools for the authenticated employee.
  version: "1.0.0"
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.edmx

provides:
  apis:
    - name: sap-sf-employee-profile-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:hr-information-agent-10e0d.sap-sf-employee-profile-mcp-server:v1

requires:
  - name: ECEmployeeProfile
    kind: api
    ordId: sap.sf:apiResource:ECEmployeeProfile:v1
